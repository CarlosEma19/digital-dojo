<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark & light mode</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Dark & light</h1>
  </header>

  <div class="toggle">
    <h2>Switch Mode:</h2>

    <button id="theme-toggle" onclick="document.documentElement.classList.toggle('dark')">
      <span class="toggle-slider"></span>
    </button>
  </div>

</body>

</html>
