<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Masonry</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top">
    <h1 class="title">Masonry Horizontal</h1>
  </header>

  <div class="container">

    <div class="quad"><img class="square" src="https://picsum.photos/id/200/400/400" alt="gatinho"></div>

    <div class="slide-s"><img class="horizontal" src="https://picsum.photos/id/22/800/400" alt="gatinho"></div>

    <div class="slide-3"><img class="vertical-x2" src="https://picsum.photos/id/19/400/800" alt="gatinho"></div>

    <div class="slide-2"><img class="vertical" src="https://picsum.photos/id/18/400/800" alt="gatinho"></div>

    <div><img class="square" src="https://picsum.photos/id/65/400/400" alt="gatinho"></div>

    <div class="slide-2"><img class="vertical" src="https://picsum.photos/id/89/400/800" alt="gatinho"></div>

    <div><img class="square" src="https://picsum.photos/id/5/400/400" alt="gatinho"></div>

  </div>
</body>

</html>
