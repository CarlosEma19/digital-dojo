<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs Horizontal CSS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="tabs-container">
      <div class="tabs">
        <input type="radio" name="tabs" id="tab1" checked />
        <label for="tab1" class="tab-label">Informações</label>

        <input type="radio" name="tabs" id="tab2" />
        <label for="tab2" class="tab-label">Configurações</label>

        <input type="radio" name="tabs" id="tab3" />
        <label for="tab3" class="tab-label">Suporte</label>

        <div class="tab-content" id="content-tab1">
          <h3>Informações do Produto</h3>
          <p>
            Conteúdo detalhado sobre as características principais do produto.
          </p>
        </div>

        <div class="tab-content" id="content-tab2">
          <h3>Configurações Personalizadas</h3>
          <p>Opções avançadas para personalizar sua experiência.</p>
        </div>

        <div class="tab-content" id="content-tab3">
          <h3>Suporte Técnico</h3>
          <p>Entre em contato com nossa equipe para assistência.</p>
        </div>
      </div>
    </div>
  </body>
</html>
