<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accordion Acessível com CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 
  Implementação de accordion usando apenas CSS:
  1. Técnica: transição de max-height para animação suave
  2. Requisitos:
    - Acessível via teclado (tab/enter)
    - Animações suaves de abertura/fechamento
    - Estados visuais claros (hover/focus)
  3. Estrutura básica:
    - Botão de trigger (role="button")
    - Container do conteúdo (role="region")
    - Transição controlada por :checked ou :focus-within
  -->
</body>
</html>
